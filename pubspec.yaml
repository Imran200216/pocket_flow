name: pocket_flow
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  # Icons for iOS style widgets
  cupertino_icons: ^1.0.8

  # State management
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^11.0.0

  # Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Local DB
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI 
  flutter_svg: ^2.3.2
  smooth_page_indicator: ^3.0.0
  shimmer: ^4.0.0
  flutter_animate: ^4.5.2
  dropdown_button2: ^3.1.0
  auto_route: ^11.2.0
  currency_picker: ^2.0.22
  

  # Dependency injection
  injectable: ^3.0.0
  get_it: ^9.3.0
  


  # Localization
  flutter_localizations:
    sdk: flutter
  intl: any
  

  
  


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.15.1
  auto_route_generator: ^10.6.0
  freezed: ^3.2.5
  json_serializable: ^6.15.2
  injectable_generator: ^3.1.3
  flutter_gen: ^5.15.0
  flutter_gen_runner: ^5.15.0


flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/svg/

  fonts:
    - family: InstrumentSans
      fonts:
        - asset: assets/fonts/InstrumentSans.ttf

flutter_gen:
  output: lib/core/gen/
  line_length: 80
  integrations:
    flutter_svg: true
